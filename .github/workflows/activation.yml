name: 1) Obtener archivo de activacion de Unity

# Workflow AYUDANTE para conseguir la licencia gratuita de Unity (paso único).
# Se lanza a mano desde la pestaña "Actions" (botón "Run workflow").
# Genera un archivo .alf que después subís a Unity para obtener tu licencia .ulf.
# Ver instrucciones detalladas en SETUP_ES.md.

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Solicitar archivo de activacion
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Subir archivo .alf como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 2
